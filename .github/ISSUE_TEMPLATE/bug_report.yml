name: Bug report
description: Report an unexpected behavior or broken feature
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For vulnerabilities, follow SECURITY.md instead. Remove sensitive data from logs.
  - type: input
    id: integration
    attributes:
      label: Integration version
      placeholder: "e.g. 1.1.3"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Pironman model
      options:
        - Pironman 5
        - Pironman 5 Max
        - Other / unsure
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Home Assistant installation
      options:
        - Home Assistant Container
        - Home Assistant OS
        - Home Assistant Core
        - Other
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Pironman software version
      description: If known
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, IP addresses, and other sensitive data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed sensitive data from this report.
          required: true
